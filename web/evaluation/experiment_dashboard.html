<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长程任务 · 对照与回放</title>
<style>
:root{font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#26364a;background:#f6f8fa;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0}main{max-width:1300px;margin:auto;padding:28px 24px 36px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}h1{font-size:25px;letter-spacing:-.03em;margin:0}p{margin:5px 0}.muted,small{color:var(--muted)}small{font-size:12px}button{font:inherit;border:1px solid #cbd5e1;border-radius:7px;background:white;padding:6px 13px;cursor:pointer}button:disabled{cursor:wait}a{color:#205a9c;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:3px solid #8db7df;outline-offset:3px}.header-right{text-align:right;flex-shrink:0}.stamp{font-size:12px;margin-bottom:6px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:890px;table-layout:fixed}th,td{padding:16px;vertical-align:top;border-bottom:1px solid var(--line);text-align:left}thead th{font-size:13px;background:#f2f5f9}th:first-child{width:190px;position:sticky;left:0;background:#f7f9fc;z-index:1}tbody tr:last-child>*{border-bottom:0}.task-name{font-size:13px;font-weight:600;overflow-wrap:anywhere}.run{scroll-margin-top:20px}.run+.run{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.run:target{outline:2px solid #8db7df;outline-offset:7px;border-radius:3px}.run-id{font-weight:650;font-size:13px}.score{margin:7px 0;font-variant-numeric:tabular-nums}.replay-link{display:inline-block;font-size:13px}.empty{color:#94a3b8}.error{padding:12px;background:#fff0df;border-radius:7px;color:#8b4b00}[hidden]{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:700px){main{padding:18px 12px 28px}h1{font-size:21px}header{align-items:flex-start;gap:10px}.stamp{max-width:125px;font-size:10px}th:first-child{width:150px}th,td{padding:12px}table{min-width:820px}}
</style>
</head>
<body><main>
<header><div><h1>长程任务 · 对照与回放</h1></div><div class="header-right"><p id="updated" class="stamp muted">读取结果中…</p><button id="refresh">刷新</button></div></header>
<p id="error" class="error" role="status" hidden></p>
<div id="content"></div>
<footer>分数为终态条件满足数；动作数包含失败尝试。回放含逐步 Agent Step、图像和视频。</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let loading=false;
function node(tag,text='',cls=''){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function replayLink(text,r,cls=''){const a=node('a',text,cls);a.href='../'+r.replay;return a;}
function card(r){
 const c=node('article','','run');c.id=r.run;c.dataset.status=r.status;c.dataset.arm=r.arm;
 c.append(node('div',r.run,'run-id'));
 const score=(r.status==='service_interrupted'?'收尾 ':'')+(r.score||'未评分');
 c.append(node('p','完成度 '+score+' · '+(r.actions??r.replay_actions)+' 次动作','score'));
 if(r.replay)c.append(replayLink((r.replay_scope==='阶段快照'?'阶段回放':'Agent Step 回放')+' ↗',r,'replay-link'));
 else c.append(node('small','回放整理中'));
 return c;
}
function render(data){
 const rows=data.runs,arms=Object.keys(data.arm_names),superseded=new Set(rows.map(r=>r.retry_of).filter(Boolean));
 const wrap=node('div','','table-wrap'),table=node('table'),head=node('thead'),tr=node('tr');
 table.setAttribute('aria-label','长程任务对照');tr.append(node('th','任务'));
 for(const arm of arms){const th=node('th',data.arm_names[arm]);th.scope='col';tr.append(th);}head.append(tr);table.append(head);
 const body=node('tbody');
 for(const task of data.task_order){
  const rs=rows.filter(r=>r.task===task);if(!rs.length)continue;
  const row=node('tr');row.dataset.task=task;const th=node('th');th.scope='row';
  th.append(node('div',task,'task-name'));
  row.append(th);
  for(const arm of arms){const td=node('td');for(const r of rs.filter(r=>r.arm===arm&&!superseded.has(r.run)))td.append(card(r));if(!td.childNodes.length)td.append(node('span','—','empty'));row.append(td);}body.append(row);
 }
 table.append(body);wrap.append(table);$('content').replaceChildren(wrap);
 $('updated').textContent='更新 '+new Date(data.at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
}
function locate(){const id=decodeURIComponent(location.hash.slice(1));if(id)document.getElementById(id)?.scrollIntoView({block:'center'});}
async function refresh(){
 if(loading)return;loading=true;$('refresh').disabled=true;
 try{const res=await fetch('review_manifest.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const first=!$('content').childNodes.length;render(await res.json());$('error').hidden=true;if(first)locate();}
 catch(e){$('error').textContent='暂时无法更新，请稍后刷新。';$('error').hidden=false;}
 finally{loading=false;$('refresh').disabled=false;}
}
$('refresh').onclick=refresh;window.addEventListener('hashchange',locate);refresh();setInterval(refresh,60000);
</script></body></html>
