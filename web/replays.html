<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务结果与回放 · OmniGibson</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243443;background:#f5f7f8;color-scheme:light;--muted:#788792;--line:#e0e7ea;--accent:#227c70}
*{box-sizing:border-box}body{margin:0}main{max-width:1720px;padding:18px 24px 28px;margin:auto}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,select{font:inherit;color:inherit}button,a,select,summary{touch-action:manipulation}button,select{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 10px}button,summary{cursor:pointer}button:hover{background:#edf4f2}:focus-visible{outline:3px solid #a7d4c7;outline-offset:3px}[hidden]{display:none!important}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:21px;font-weight:650;margin:0}.brand{font-size:12px;color:var(--muted);font-weight:400;margin-left:10px}.live{font-size:12px;color:var(--muted);white-space:nowrap}.live::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#368b72}.summary{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#657780;margin:12px 0 17px}.summary b{font-weight:600;color:#344953}.progress{display:flex;align-items:center;gap:9px}.progress progress{width:80px;height:4px;accent-color:var(--accent)}.success{color:#287354}.failure{color:#ac5a46}.unscored{color:#977544}.summary .queue{margin-left:auto}
.selection{display:flex;align-items:center;gap:12px}.selection label{font-size:12px;color:var(--muted);white-space:nowrap}.selection select{font-size:15px;font-weight:550;min-width:0;width:min(650px,65%);padding:9px 12px}.selection .result{font-size:12px;white-space:nowrap}.selection a{margin-left:auto;font-size:12px;white-space:nowrap}.instruction{font-size:13px;line-height:1.6;margin:10px 0 14px;color:#61727c;overflow-wrap:anywhere}.viewer{position:relative}iframe{display:block;width:100%;height:680px;border:0;background:transparent}.notice{font-size:13px;color:#a45640;margin:10px 0}.empty{padding:70px 24px;text-align:center;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:white}
.support{margin-top:18px;border-top:1px solid var(--line);font-size:12px;color:#6b7c85}.support details{border-bottom:1px solid var(--line);padding:13px 0}.support summary{width:fit-content;color:#586d78}.support summary span{margin-left:8px;color:#8b99a1}.detail-body{padding:14px 0 3px;line-height:1.8}.worker{margin:3px 0}.table-scroll{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid #e6ecef}th{font-weight:500;color:#8a98a0}td:first-child,th:first-child{padding-left:0;width:32px}.task-button{border:0;background:transparent;padding:0;color:var(--accent);text-align:left;font-size:12px}.task-button[aria-current=true]{font-weight:700}p{margin:7px 0}.helper{color:#8b99a1;font-size:11px}
@media(max-width:760px){main{padding:14px 12px 22px}h1{font-size:19px}.brand{display:none}.summary{gap:6px 12px;margin:10px 0 13px}.summary .queue{margin-left:0}.progress progress{width:45px}.selection{flex-wrap:wrap;gap:8px}.selection label{display:none}.selection select{width:100%;flex-basis:100%;font-size:14px}.instruction{font-size:12px;margin:9px 0 12px}.support{margin-top:12px}.live{font-size:11px}iframe{height:1200px}.support summary span{font-size:11px}}
.batches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0 8px}.batch{text-align:left;padding:11px 13px;background:#fff}.batch[aria-pressed=true]{border-color:var(--accent);background:#eaf4f0}.batch strong{display:block;font-size:13px}.batch small{display:block;font-size:11px;color:#667c82;margin-top:4px}.batch-note{font-size:12px;color:#6b7c85;line-height:1.65;margin:8px 0}.live.completed::before{background:#87959b}.selection select{flex:1}.search{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px;width:min(100%,340px);margin-bottom:8px}@media(max-width:760px){.batches{grid-template-columns:repeat(2,minmax(0,1fr))}.selection select{flex-basis:100%}.batch{padding:9px}.batch-note{font-size:11px}}
</style>
</head>
<body><main>
<header>
 <div class="heading"><h1>任务结果与回放<span class="brand">OmniGibson</span></h1><span id="updated" class="live">读取进度…</span></div>
 <nav id="batches" class="batches" aria-label="选择评测批次"></nav>
 <p id="batch-note" class="batch-note"></p>
 <div class="summary" aria-label="评测进度">
  <span class="progress">已结束 <b id="ended">—</b><progress id="progress" value="0" max="32" aria-label="批次完成进度"></progress></span>
  <span class="success">目标成功 <b id="passed">—</b></span><span class="failure">目标未完成 <b id="failed">—</b></span><span class="unscored">无评分 <b id="blocked">—</b></span><span id="rate"></span>
  <span class="queue"><span id="running">—</span> 进行中 · <span id="planned">—</span> 待开始</span>
 </div>
</header>
<section aria-label="选择任务">
 <div class="selection"><label for="run">任务</label><select id="run" aria-label="选择任务回放" disabled><option>读取任务…</option></select><span id="result" class="result"></span><a id="open" target="_blank" rel="noopener" hidden>独立打开 ↗</a></div>
 <p id="instruction" class="instruction"></p><p id="error" class="notice" role="alert" hidden></p>
 <p id="run-diagnostic" class="notice" hidden></p>
</section>
<section class="viewer" aria-label="任务回放">
 <div id="empty" class="empty" hidden>还没有已发布的回放，任务完成后会出现在这里。</div>
 <iframe id="replay" title="相机观测与模型时间线" allow="fullscreen" allowfullscreen hidden></iframe>
</section>
<aside class="support" aria-label="更多评测信息">
 <details id="task-details"><summary>全部任务与运行状态<span id="task-count"></span></summary><div class="detail-body">
  <div id="workers"></div><p id="record-time" class="helper"></p>
  <input id="task-search" class="search" type="search" placeholder="搜索任务" aria-label="搜索全部任务">
  <div class="table-scroll"><table><thead><tr><th>#</th><th>任务</th><th>结果 / 阶段</th><th>Q</th><th>动作数</th></tr></thead><tbody id="tasks"></tbody></table></div>
 </div></details>
</aside>
</main>
<script src="replay_portal.js"></script>
</body></html>
