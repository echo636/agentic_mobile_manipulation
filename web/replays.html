<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务回放 · OmniGibson</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20332e;background:#f4f6f3;color-scheme:light;--muted:#748179;--line:#dde4dd;--accent:#286b57;--soft:#eaf2e9;--good:#2f7650;--bad:#a44a3c;--amber:#997027}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button,select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #a5c9ad;outline-offset:2px}[hidden]{display:none!important}
.topbar{flex:none;background:#fcfdfa;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:18px;align-items:center;min-height:63px}.brand{display:flex;gap:10px;align-items:baseline;flex:none}.brand h1{font-size:18px;font-weight:750;letter-spacing:-.03em;margin:0}.brand span{font-size:11px;color:var(--muted)}.top-links{margin-left:auto;display:flex;align-items:center;gap:16px;white-space:nowrap;font-size:12px}.live{color:var(--muted);font-size:11px}.live::before{content:"";display:inline-block;width:6px;height:6px;background:#4c9371;border-radius:50%;margin-right:6px}.live.completed::before{background:#99a498}.batches{display:flex;gap:6px;min-width:0;overflow-x:auto}.batch{padding:6px 10px;font-size:12px;white-space:nowrap;background:transparent}.batch[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#a8c3ac}.mobile-only{display:none}
.portal{display:grid;grid-template-columns:286px minmax(0,1fr);flex:1;min-height:0}.sidebar{display:flex;flex-direction:column;min-height:0;background:#fcfdfa;border-right:1px solid var(--line)}.sidebar-top{padding:18px 14px 12px;flex:none}.sidebar-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.sidebar-heading h2{font-size:13px;margin:0}.sidebar-heading span{font-size:11px;color:var(--muted)}.search-wrap{position:relative}.search-icon{position:absolute;left:11px;top:9px;color:#8b968d;font-size:14px;pointer-events:none}.search{width:100%;padding:9px 10px 9px 31px;border:1px solid var(--line);border-radius:7px;background:#f5f7f3;font-size:12px;outline-offset:2px}.filter-row{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.filter{font-size:11px;padding:4px 8px;border-color:transparent;background:transparent;color:var(--muted)}.filter[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#c2d7c2}.task-list{overflow-y:auto;min-height:0;padding:0 8px 12px;overscroll-behavior:contain;scrollbar-width:thin}.task-button{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:7px;text-align:left;border:1px solid transparent;border-left:3px solid transparent;border-radius:6px;padding:11px 9px;margin:0 0 4px;background:transparent}.task-button:hover{background:#f0f4ee}.task-button[aria-current=true]{background:#e9f1e6;border-color:#cfddca;border-left-color:var(--accent)}.task-index{font:11px ui-monospace,SFMono-Regular,monospace;color:#89958a;padding-top:3px}.task-title{display:block;font-size:12px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:5px}.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px}.success{color:var(--good)}.failure{color:var(--bad)}.unscored{color:var(--amber)}.in-progress{color:#356b9b}.task-replay{margin-left:auto;color:#8b988b;font-size:10px}.no-matches{font-size:12px;color:var(--muted);padding:25px 8px;text-align:center}.sidebar-bottom{padding:11px 14px;border-top:1px solid var(--line);font-size:10px;line-height:1.6;color:#8a958b;flex:none}.batch-note{margin:0}.drawer-close{display:none}
.content{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 16px 12px;gap:0}.batch-progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none;font-size:11px;color:var(--muted);padding:12px 1px;border-bottom:1px solid var(--line)}.batch-progress b{font-weight:750;color:inherit}.progress{display:flex;gap:8px;align-items:center;color:#405946}.progress progress{width:74px;height:4px;accent-color:var(--accent)}.queue{margin-left:auto}.rate{font-size:10px}.episode-header{padding:12px 1px 10px;flex:none;min-width:0}.episode-heading{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.episode-title{min-width:0}.episode-eyebrow{font-size:10px;letter-spacing:.08em;color:#809182;text-transform:uppercase;margin-bottom:4px}.episode-title h2{font-size:16px;line-height:1.35;font-weight:700;overflow-wrap:anywhere;margin:0}.episode-actions{display:flex;gap:10px;align-items:center;flex:none;font-size:11px;padding-top:2px}.attempt-select{font-size:11px;padding:5px 7px;max-width:210px}.result{display:block;font-size:11px;margin-top:6px}.instruction{font-size:12px;line-height:1.65;margin:7px 0 0;color:#5c6e60;max-height:4.95em;overflow-y:auto;overflow-wrap:anywhere;scrollbar-width:thin}.notice{font-size:11px;color:var(--bad);margin:7px 0 0;padding:7px 9px;border-left:2px solid #c88871;background:#fbf1eb}.viewer{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}iframe{display:block;flex:1;width:100%;height:100%;min-height:0;border:0;background:transparent;border-radius:8px}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:220px;text-align:center;border:1px solid var(--line);border-radius:9px;background:#fbfcf9;padding:28px;color:var(--muted);font-size:13px;line-height:1.8}.empty strong{display:block;color:#506952;font-size:16px;margin-bottom:7px}.drawer-backdrop{display:none}
@media(min-width:1800px){.portal{grid-template-columns:310px minmax(0,1fr)}.content{padding-right:22px;padding-left:22px}}
@media(max-width:1000px){.portal{grid-template-columns:238px minmax(0,1fr)}.content{padding:0 11px 10px}.topbar{padding:11px 14px;gap:12px}.brand span{display:none}.batch-progress{gap:6px 12px}.queue{margin-left:0}.episode-title h2{font-size:14px}.episode-actions{gap:7px}.attempt-select{max-width:160px}.top-links{gap:10px}.task-button{padding:10px 6px;grid-template-columns:21px minmax(0,1fr)}}
@media(max-width:760px){html,body{height:auto;min-height:100%}body{overflow:auto}.viewer{display:block;flex:none}iframe{height:1220px}.mobile-only{display:inline-flex}.topbar{position:sticky;top:0;z-index:10;min-height:55px;padding:9px 11px;gap:10px;flex-wrap:wrap}.brand h1{font-size:16px}.top-links{gap:10px;font-size:11px}.top-links .live{display:none}.batches{order:3;flex-basis:100%}.portal{display:block;position:relative;min-height:0;flex:none}.content{height:auto;padding:0 9px 9px}.batch-progress{font-size:10px;padding:9px 1px;gap:5px 11px}.progress progress{width:40px}.rate{display:none}.episode-header{padding:9px 1px}.episode-heading{gap:8px}.episode-actions{flex-wrap:wrap;justify-content:flex-end;max-width:135px}.episode-title h2{font-size:14px}.episode-eyebrow{font-size:9px}.instruction{font-size:11px;max-height:4.95em}.result{font-size:10px}.attempt-select{max-width:133px;font-size:10px}.sidebar{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-102%);transition:transform .18s ease;border-right:1px solid #cdd9ca;box-shadow:12px 0 50px #10251220}.sidebar-open .sidebar{transform:translateX(0)}.drawer-close{display:inline-flex;padding:4px 8px;font-size:17px;line-height:1;border-color:transparent}.drawer-backdrop{position:fixed;inset:0;z-index:29;background:#18251e66;border:0;border-radius:0;padding:0;width:100%;height:100%}.sidebar-open .drawer-backdrop{display:block}.sidebar-top{padding-top:19px}.task-list{padding-bottom:20px}#task-drawer{padding:5px 8px;font-size:11px}.empty{min-height:180px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
 <button id="task-drawer" class="mobile-only" aria-expanded="false" aria-controls="task-sidebar">任务列表</button>
 <div class="brand"><h1>任务回放</h1><span>OMNIGIBSON</span></div>
 <nav id="batches" class="batches" aria-label="选择评测批次"></nav>
 <div class="top-links"><span id="updated" class="live" role="status">读取进度…</span><a id="summary-link" hidden>评测汇总 ↗</a></div>
</header>
<main class="portal">
 <aside id="task-sidebar" class="sidebar" aria-label="任务列表">
  <div class="sidebar-top">
   <div class="sidebar-heading"><h2 id="batch-label">本批任务</h2><span id="task-count"></span><button id="drawer-close" class="drawer-close" aria-label="关闭任务列表">×</button></div>
   <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="task-search" class="search" type="search" placeholder="搜索任务或指令" aria-label="搜索任务或指令" autocomplete="off"></div>
   <div class="filter-row" aria-label="筛选任务状态"><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="success" aria-pressed="false">成功</button><button class="filter" data-filter="failure" aria-pressed="false">未完成</button><button class="filter" data-filter="active" aria-pressed="false">未结束</button></div>
  </div>
  <div id="tasks" class="task-list"><p class="no-matches">读取任务…</p></div>
  <div class="sidebar-bottom"><p id="batch-note" class="batch-note"></p></div>
 </aside>
 <section class="content" aria-label="选中任务回放">
  <div class="batch-progress" aria-label="本批评测进度">
   <span class="progress">已结束 <b id="ended">—</b><progress id="progress" value="0" max="32" aria-label="批次完成进度"></progress></span>
   <span class="success">成功 <b id="passed">—</b></span><span class="failure">未完成 <b id="failed">—</b></span><span class="unscored">无评分 <b id="blocked">—</b></span>
   <span id="rate" class="rate"></span><span class="queue"><span id="running">—</span> 进行中 · <span id="planned">—</span> 待开始</span>
  </div>
  <div class="episode-header">
   <div class="episode-heading"><div class="episode-title"><div id="episode-label" class="episode-eyebrow">EPISODE REPLAY</div><h2 id="task-title">选择任务查看回放</h2><span id="result" class="result"></span></div><div class="episode-actions"><select id="run" class="attempt-select" aria-label="选择这个任务的历史尝试" hidden></select><a id="open" target="_blank" rel="noopener" hidden>独立打开 ↗</a></div></div>
   <p id="instruction" class="instruction"></p><p id="error" class="notice" role="alert" hidden></p><p id="run-diagnostic" class="notice" hidden></p>
  </div>
  <div class="viewer">
   <div id="empty" class="empty"><strong>读取回放</strong>选择左侧任务，查看观测与模型运行过程。</div>
   <iframe id="replay" title="相机观测与模型时间线" allow="fullscreen" allowfullscreen hidden></iframe>
  </div>
 </section>
</main>
<button id="drawer-backdrop" class="drawer-backdrop" aria-label="关闭任务列表" tabindex="-1"></button>
<script src="replay_portal.js?v=20261005-jiarui"></script>
</body>
</html>
