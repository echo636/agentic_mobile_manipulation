[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-agentic-system"
version = "0.1.0"
description = "An auditable agent harness for OmniGibson manipulation research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.28.1"]

[project.scripts]
manip-agent = "manipulation_agent.cli:main"
manip-mcp = "manipulation_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manipulation_agent = ["tasks.json"]
