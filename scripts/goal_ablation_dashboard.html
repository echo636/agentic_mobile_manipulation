<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分层目标规划 · 100 × 2 对照实验</title>
<style>body{font:15px/1.6 system-ui;color:#173449;background:#f4f7fa;max-width:1300px;margin:32px auto;padding:0 22px}h1{font-size:27px}a{color:#16649d}table{border-collapse:collapse;width:100%;background:white;margin:18px 0}td,th{text-align:left;border-bottom:1px solid #dae4ed;padding:12px;vertical-align:top}small{display:block;color:#678}select{padding:7px}#error{color:#9b392e}.success{color:#17825e}.failed{color:#b24736}p{max-width:1000px}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{padding:16px;background:white;border:1px solid #dae4ed;border-radius:10px;min-width:250px}</style>
<h1>分层目标规划 · 两组各 100 个任务</h1>
<p>两组使用相同的任务、实例 301、seed 0、GPT 6.1 Sol low、其他 skills、笔记工具和 50 个 act/look 上限，无任务时间上限。实验组使用目标分解 skill；对照组自行规划和维护笔记。目标树完成标记与独立任务评分分开展示。</p>
<p><a href="hierarchical/behavior100.html">实验组完整进度</a> · <a href="unguided/behavior100.html">对照组完整进度</a> · <a href="comparison.json">对比数据</a></p>
<div class="cards" id="cards"></div><p id="paired"></p><p id="updated"></p><p id="error"></p>
<label>任务范围 <select id="filter"><option value="all">全部 100 项</option><option value="detailed">前 50 · 详细指令</option><option value="short">后 50 · 短语指令</option></select></label>
<table><thead><tr><th>任务</th><th>有目标分解 skill</th><th>无目标分解 skill</th></tr></thead><tbody id="tasks"></tbody></table>
<script>
let data;const $=id=>document.getElementById(id),labels={hierarchical:'有分层目标 skill',unguided:'GPT 自行规划'};
function el(tag,text){const e=document.createElement(tag);if(text!=null)e.textContent=String(text);return e}
function render(){if(!data)return;$('cards').replaceChildren();for(const [cohort,label] of [['all','全部'],['detailed_first50','前 50 · 详细指令'],['short_phrase_last50','后 50 · 短语指令']]){const box=el('div');box.className='card';box.append(el('strong',label));for(const arm of ['hierarchical','unguided']){const s=data.cohorts[cohort][arm];box.append(el('p',`${labels[arm]}：完成 ${s.completed}/${s.total}；成功 ${s.successes}，缺失评分 ${s.unknown_score}`))}$('cards').append(box)}
$('paired').textContent=`已配对评分 ${data.paired.scored} 项：两组都成功 ${data.paired.both_success}；仅实验组成功 ${data.paired.hierarchical_only}；仅对照组成功 ${data.paired.unguided_only}。进行中的差异尚不能作为最终结论。`;
$('updated').textContent='更新：'+data.updated_at;$('tasks').replaceChildren();for(const t of data.tasks){if($('filter').value==='detailed'&&t.index>=50||$('filter').value==='short'&&t.index<50)continue;const tr=el('tr');const title=el('td',`${t.index+1}. ${t.task.replaceAll('_',' ')}`);title.append(el('small',t.instruction_source));tr.append(title);for(const arm of ['hierarchical','unguided']){const r=t.arms[arm],td=el('td');td.append(el('strong',r.task_success===true?'独立评分：成功':r.task_success===false?'独立评分：未完成':r.status==='planned'?'待开始':r.stage||r.status));td.append(el('small',`agent steps ${r.agent_steps??'—'} · Q ${r.q_score??'—'}`));if(r.planning_metrics){td.append(el('small',`笔记更新 ${r.planning_metrics.notes_writes} 次 · 目标树版本 ${r.planning_metrics.goal_tree_versions} · 行动前有规划 ${r.planning_metrics.notes_before_first_action===true?'是':r.planning_metrics.notes_before_first_action===false?'否':'—'}`))}if(r.termination_reason)td.append(el('small',r.termination_reason));if(r.controller_cleanup)td.append(el('small','客户端清理：'+r.controller_cleanup.reason));if(r.replay_url){const link=el('a','查看规划、行动与视频 ↗');link.href=arm+'/'+r.replay_url;td.append(link)}tr.append(td)}$('tasks').append(tr)}}
async function refresh(){try{const r=await fetch('comparison.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();render();$('error').textContent=''}catch(e){$('error').textContent='对比数据尚未就绪；页面将自动刷新。'}}$('filter').onchange=render;refresh();setInterval(refresh,20000);
</script></html>
