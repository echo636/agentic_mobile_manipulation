<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务回放 · Mobile Manipulation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#23374c;font:15px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px 24px 60px}a{color:#2863ac;text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;gap:24px;flex-wrap:wrap;font-size:13px}h1{font-size:29px;margin:22px 0 5px}h2{font-size:18px;margin:0;overflow-wrap:anywhere}p{margin:6px 0}.muted{color:#617387;font-size:13px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 18px}input,select{font:inherit;font-size:14px;color:inherit;padding:9px 12px;border:1px solid #c6d2de;border-radius:7px;background:white}input{flex:1;min-width:150px}select{max-width:100%}.task-card{background:white;border:1px solid #d8e1eb;border-radius:10px;margin:14px 0;overflow:hidden}.task-heading{padding:17px 20px}.task-number{font-size:11px;color:#617387;margin-bottom:4px}.instruction{margin-top:9px;font-size:13px}.instruction summary{cursor:pointer;color:#617387}.instruction p{white-space:pre-wrap;overflow-wrap:anywhere}.arms{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d8e1eb}.arm{padding:15px 20px;min-width:0}.arm+.arm{border-left:1px solid #d8e1eb}.arm-label{font-size:12px;color:#617387}.result{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}.badge{font-size:13px;font-weight:650;border-radius:4px;padding:2px 8px;background:#eef2f6;color:#566b7f}.passed{background:#e6f4ed;color:#206c50}.failed{background:#fff0e8;color:#995638}.replay-link{display:inline-block;margin-top:6px;font-size:13px}.empty{padding:28px;text-align:center;color:#617387}.summary{margin-top:12px;color:#536c82;font-size:13px}
@media(max-width:600px){main{padding:20px 12px 40px}h1{font-size:25px}.task-heading{padding:15px}.arms{grid-template-columns:1fr}.arm{padding:13px 15px}.arm+.arm{border-left:0;border-top:1px solid #d8e1eb}.toolbar{gap:8px}.toolbar input{flex-basis:100%}}
</style></head><body><main>
<nav><a href="/long_horizon_execution_20261015/">← 实验总览</a><a href="../new100/behavior100.html">新100任务进度 ↗</a></nav>
<h1>任务回放</h1><p class="muted">2026-10-14 · 分层目标规划对照实验 · GPT 6.1 Sol low · 50 agent steps</p><p id="summary" class="summary"></p>
<div class="toolbar"><input id="search" type="search" aria-label="搜索任务或指令" placeholder="搜索任务或指令"><select id="instruction-filter" aria-label="指令类型"><option value="all">全部指令</option><option value="detailed">详细指令</option><option value="short">短语指令</option></select><span id="count" class="muted" aria-live="polite"></span></div>
<div id="tasks"></div></main>
<script type="application/json" id="collection-data">@@DATA@@</script>
<script>
const data=JSON.parse(document.getElementById('collection-data').textContent),$=id=>document.getElementById(id);
const arms=[['hierarchical','实验组 · 目标分解 skill'],['unguided','对照组 · 自行规划']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('summary').textContent=data.tasks.length+' 个任务 · '+arms.map(([key,label])=>label.split(' · ')[0]+'成功 '+data.tasks.filter(t=>t.arms[key]?.task_success===true).length+'/'+data.tasks.length).join(' · ')+' · 结果采用独立评分';
function armCell(key,label,record){const r=record||{},result=r.task_success===true?'成功':r.task_success===false?'未完成':'未取得评分';return `<section class="arm" data-arm="${key}"><div class="arm-label">${label}</div><div class="result"><span class="badge ${r.task_success===true?'passed':r.task_success===false?'failed':''}">${result}</span><span class="muted">${r.agent_steps??'—'} steps · Q ${r.q_score==null?'—':Number(r.q_score).toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}</span></div>${r.replay_url?`<a class="replay-link" href="${esc(r.replay_url)}">查看目标、行动与视频 ↗</a>`:'<span class="muted">暂无回放</span>'}</section>`;}
function render(){const query=$('search').value.trim().toLowerCase(),kind=$('instruction-filter').value;const tasks=data.tasks.filter(t=>(kind==='all'||(t.index<50?'detailed':'short')===kind)&&(!query||[t.task,t.task.replaceAll('_',' '),t.instruction].join(' ').toLowerCase().includes(query)));$('count').textContent=tasks.length+' 个任务';$('tasks').innerHTML=tasks.map(t=>`<article class="task-card" data-task="${esc(t.task)}"><div class="task-heading"><div class="task-number">TASK ${String(t.index+1).padStart(2,'0')} · ${t.index<50?'详细指令':'短语指令'}</div><h2>${esc(t.task.replaceAll('_',' '))}</h2><details class="instruction"><summary>任务指令</summary><p>${esc(t.instruction)}</p></details></div><div class="arms">${arms.map(([key,label])=>armCell(key,label,t.arms[key])).join('')}</div></article>`).join('')||'<p class="empty">没有匹配的任务。</p>';}
$('search').oninput=render;$('instruction-filter').onchange=render;render();
</script></body></html>
